# quickproof config for openverse_arith (quickproof/tools/clight.sh): the int operations of the
# openverse C runtime, runtime/src/arith.c. Per-law linking (docs/LINKING.md).
LINK=per-law
INC=(-I. -Iruntime/include -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "runtime/src/arith.c=src/arith"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
