# quickproof config for openverse_store (quickproof/tools/clight.sh): the transactional store of the
# openverse C runtime, runtime/src/store.c. Per-law linking (docs/LINKING.md).
LINK=per-law
INC=(-I. -Iruntime/include -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "runtime/src/store.c=src/store"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
