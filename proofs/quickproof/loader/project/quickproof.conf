# quickproof config for openverse_loader (quickproof/tools/clight.sh): the OVBC loader of the
# openverse C runtime, runtime/src/load.c. Per-law linking (docs/LINKING.md).
LINK=per-law
INC=(-I. -Iruntime/include -isystem "$(gcc -print-file-name=include)")
DEFS=()
UNITS=(
  "runtime/src/load.c=src/load"
  "$GP/libc/libc.c=src/libc"
  "$GP/libc/malloc_unit.c=src/malloc"
)
